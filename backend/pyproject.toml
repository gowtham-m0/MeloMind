[project]
name = "melomind-backend"
version = "0.1.0"
description = "MeloMind backend API"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi==0.161.0",
    "httpx==0.28.1",
    "langchain==1.4.7",
    "langchain-google-genai==4.4.2",
    "langchain-groq==1.1.3",
    "langgraph==1.2.16",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyjwt[crypto]==2.15.1",
    "sqlalchemy[asyncio]==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]
# Year ranges in the agent log read "1961–1969", with an en dash.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# Alembic names migration files after their revision number.
"alembic/versions/*" = ["N999"]
